when:
  - event: [push, pull_request]
    branch: [main]

steps:
  - name: test
    image: rust:1.88-slim
    commands:
      - cargo test

  - name: build-pr-image
    image: woodpeckerci/plugin-docker-buildx:5.0.0
    depends_on: [test]
    when:
      - event: [pull_request]
        branch: [main]
    settings:
      registry: ghcr.io
      repo: ghcr.io/cyberstorm-dev/gatus-mcp-rs
      dockerfile: Dockerfile
      context: .
      platforms: linux/amd64
      dry_run: true
      tags:
        - pr-${CI_COMMIT_SHA:0:7}

  - name: publish-image
    image: woodpeckerci/plugin-docker-buildx:5.0.0
    depends_on: [test]
    when:
      - event: [push]
        branch: [main]
    settings:
      registry: ghcr.io
      repo: ghcr.io/cyberstorm-dev/gatus-mcp-rs
      dockerfile: Dockerfile
      context: .
      platforms: linux/amd64
      username:
        from_secret: ghcr_username
      password:
        from_secret: ghcr_token
      tags:
        - ${CI_COMMIT_SHA}
